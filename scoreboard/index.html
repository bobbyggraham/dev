<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Engage Field</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#0b1421; --navy:#133865; --brand:#365aa0; --steel:#718dbc;
  --ltblue:#c5d9fa; --gold:#ebb018; --gold-dim:rgba(235,176,24,.16);
  --bulb-glow:0 0 6px rgba(235,176,24,.85), 0 0 18px rgba(235,176,24,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:
    radial-gradient(1200px 500px at 50% -10%, #1a2c47 0%, transparent 60%),
    #060b13;
  color:var(--ltblue);
  font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif;
  min-height:100vh; padding:28px 14px 60px; display:flex; flex-direction:column; align-items:center;
}
.marquee{
  font-family:'Oswald',Impact,'Arial Black',sans-serif;
  color:#fff; letter-spacing:.35em; font-size:clamp(15px,2.6vw,22px); font-weight:700;
  text-align:center; margin-bottom:6px;
}
.marquee small{display:block;color:var(--steel);letter-spacing:.22em;font-size:.55em;font-weight:500;margin-top:4px}
.board{
  width:min(980px,100%);
  background:linear-gradient(180deg,#0e1b30 0%, var(--deep) 55%, #081020 100%);
  border:3px solid #223a5e; border-radius:14px;
  box-shadow:0 0 0 6px #0a1524, 0 18px 60px rgba(0,0,0,.7), inset 0 1px 0 rgba(197,217,250,.15);
  padding:22px 22px 18px; position:relative; margin-top:14px;
}
.board::before,.board::after{
  content:""; position:absolute; top:10px; bottom:10px; width:6px;
  background:repeating-linear-gradient(180deg,#2a4570 0 6px,transparent 6px 34px);
  border-radius:3px; opacity:.5;
}
.board::before{left:8px}.board::after{right:8px}
.matchup{
  display:flex; justify-content:center; align-items:baseline; gap:14px;
  font-family:'Oswald',sans-serif; margin-bottom:14px; flex-wrap:wrap;
}
.matchup .team{color:#fff;font-size:clamp(20px,4vw,34px);font-weight:700;letter-spacing:.06em}
.matchup .vs{color:var(--gold);font-size:clamp(13px,2vw,18px);letter-spacing:.2em}
.matchup .team.blanks{color:var(--steel)}
.gamestat{text-align:center;color:var(--steel);font-size:15px;letter-spacing:.08em;margin-bottom:16px;min-height:18px}
.gamestat b{color:var(--ltblue)}

.linescore{overflow-x:auto;border:1px solid #22406b;border-radius:8px;background:#091426}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:8px 6px;text-align:center;border-right:1px solid #16294a;font-variant-numeric:tabular-nums}
th{color:var(--steel);font-weight:600;font-size:13px;letter-spacing:.14em;border-bottom:1px solid #22406b}
td{font-family:'Oswald',monospace;font-size:20px}
tr th:first-child, tr td:first-child{
  text-align:left;padding-left:14px;min-width:110px;
  font-family:'Oswald',sans-serif;font-size:15px;letter-spacing:.12em;color:#fff;
}
tr.blanks td:first-child{color:var(--steel)}
td.lit{color:var(--gold);text-shadow:var(--bulb-glow)}
td.unlit{color:var(--gold-dim)}
td.now{background:rgba(235,176,24,.07)}

.bigstats{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(110px,1fr));
  gap:10px; margin-top:16px;
}
.stat{
  background:#091426;border:1px solid #22406b;border-radius:8px;
  padding:10px 8px 12px;text-align:center;
}
.stat .lbl{color:var(--steel);font-size:12px;letter-spacing:.18em;margin-bottom:4px}
.stat .val{
  font-family:'Oswald',monospace;color:var(--gold);text-shadow:var(--bulb-glow);
  font-size:clamp(18px,2.8vw,28px);font-weight:700;font-variant-numeric:tabular-nums;line-height:1;
}
.stat.avg .val{font-size:clamp(30px,4.6vw,44px)}
.stat .sub{color:var(--steel);font-size:12px;margin-top:5px;min-height:14px}
.trend-up{color:#7fd18a}.trend-down{color:#e58b8b}

.panel{
  width:min(980px,100%); margin-top:22px;
  background:#0c1728;border:1px solid #22406b;border-radius:12px;padding:18px;
}
.panel h2{font-family:'Oswald',sans-serif;color:#fff;font-size:17px;letter-spacing:.12em;margin-bottom:4px}
.panel p.note{color:var(--steel);font-size:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
label{display:block;font-size:13px;color:var(--ltblue);letter-spacing:.06em;margin-bottom:4px}
input{
  width:100%;background:#091120;border:1px solid #2a4570;border-radius:6px;
  color:var(--gold);font-family:'Oswald',monospace;font-size:17px;padding:8px 10px;
  font-variant-numeric:tabular-nums;
}
input:focus{outline:2px solid var(--gold);outline-offset:1px;border-color:var(--gold)}
.actions{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
button{
  font-family:'Oswald',sans-serif;letter-spacing:.1em;font-size:14px;font-weight:600;
  border-radius:6px;padding:10px 18px;cursor:pointer;border:1px solid transparent;
}
button.primary{background:var(--gold);color:var(--deep)}
button.primary:hover{background:#f7c236}
button.ghost{background:transparent;color:var(--steel);border-color:#2a4570}
button.ghost:hover{color:var(--ltblue);border-color:var(--steel)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.msg{font-size:14px;color:var(--steel)}
.msg.ok{color:#7fd18a}
.msg.err{color:#e58b8b}

details.rules{width:min(980px,100%);margin-top:16px}
details.rules summary{
  cursor:pointer;font-family:'Oswald',sans-serif;color:var(--gold);letter-spacing:.14em;
  font-size:15px;padding:10px 4px;list-style:none;
}
details.rules summary::before{content:"\25B8  ";}
details.rules[open] summary::before{content:"\25BE  ";}
details.rules summary:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:4px}
.rulebook{
  background:#0c1728;border:1px solid #22406b;border-radius:12px;padding:6px 18px 8px;
}
.rulebook dl{display:grid;grid-template-columns:max-content 1fr;gap:8px 18px;padding:12px 0}
.rulebook dt{font-family:'Oswald',sans-serif;color:#fff;letter-spacing:.1em;font-size:14px;white-space:nowrap}
.rulebook dd{color:var(--steel);font-size:15px;line-height:1.35}
.rulebook dd b{color:var(--ltblue);font-weight:600}
@media (max-width:560px){.rulebook dl{grid-template-columns:1fr}.rulebook dt{margin-top:8px}}
@media (prefers-reduced-motion:no-preference){
  .flicker{animation:flick .9s ease-out 1}
  @keyframes flick{0%{opacity:0}30%{opacity:.9}42%{opacity:.3}55%{opacity:1}70%{opacity:.7}100%{opacity:1}}
}
footer{color:#3a5170;font-size:12px;letter-spacing:.1em;margin-top:26px;text-align:center}

/* ---- batting order ---- */
.order{width:min(980px,100%);margin-top:22px}
.order-head{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-bottom:10px}
.order-head h2{font-family:'Oswald',sans-serif;color:#fff;font-size:17px;letter-spacing:.12em}
.order-head .sub{color:var(--steel);font-size:14px;margin-top:2px}
.toggle{display:flex;border:1px solid #2a4570;border-radius:6px;overflow:hidden}
.toggle button{border-radius:0;border:0;padding:7px 14px;background:transparent;color:var(--steel);font-size:13px}
.toggle button[aria-pressed="true"]{background:var(--gold);color:var(--deep)}
.order-wrap{overflow-x:auto;border:1px solid #22406b;border-radius:10px;background:#091426}
table.order-tbl{border-collapse:collapse;width:100%;min-width:880px}
table.order-tbl th{
  position:sticky;top:0;background:#0c1728;z-index:1;cursor:pointer;user-select:none;
  padding:9px 8px;font-size:12px;letter-spacing:.14em;color:var(--steel);
  border-bottom:1px solid #22406b;white-space:nowrap;
}
table.order-tbl th:hover{color:var(--ltblue)}
table.order-tbl th[aria-sort]:not([aria-sort="none"]){color:var(--gold)}
table.order-tbl th .arw{opacity:.55;font-size:10px}
table.order-tbl td{
  padding:7px 8px;font-family:'Oswald',monospace;font-size:16px;color:var(--ltblue);
  border-bottom:1px solid #12233d;border-right:0;text-align:right;font-variant-numeric:tabular-nums;
}
table.order-tbl th:not(:nth-child(2)){text-align:right}
table.order-tbl th:nth-child(2){text-align:left}
table.order-tbl tr:last-child td{border-bottom:0}
table.order-tbl tbody tr:hover td{background:rgba(235,176,24,.05)}
td.rank{text-align:right;color:var(--steel);font-size:14px;width:42px;padding-right:10px}
td.who{
  text-align:left;font-family:'Barlow Condensed',sans-serif;font-size:17px;
  color:#fff;letter-spacing:.03em;white-space:nowrap;
}
td.ba{color:var(--gold);text-shadow:var(--bulb-glow);font-size:18px}
tr.leader td.rank{color:var(--gold);text-shadow:var(--bulb-glow)}
tr.cold td.ba{color:var(--gold-dim);text-shadow:none}
td.dim{color:#4d688f}
td.wp{color:#7fd18a}
td.wp.dim{color:#4d688f}
.order-foot{color:#3a5170;font-size:13px;letter-spacing:.04em;margin-top:9px;text-align:right}
</style>
<style>
.gate{width:min(420px,100%);margin-top:34px;background:#0c1728;border:1px solid #22406b;
  border-radius:12px;padding:22px;text-align:center}
.gate h1{font-family:'Oswald',sans-serif;color:#fff;font-size:16px;letter-spacing:.18em;margin-bottom:6px}
.gate p{color:var(--steel);font-size:14px;margin-bottom:16px}
.gate form{display:flex;flex-direction:column;gap:10px}
.gate input{text-align:center;letter-spacing:.06em;font-size:16px}
.gate .err{color:#e58b8b;font-size:14px;min-height:19px}
.gate .busy{color:var(--gold);font-size:14px;min-height:19px}
</style>
</head>
<body>
<div class="marquee">ENGAGE FIELD<small>FSG GROWTH ORGANIZATION</small></div>

<div class="gate" id="gate">
  <h1>PASSCODE</h1>
  <p>This board is for the FSG growth org. Enter the passcode to load the numbers.</p>
  <form id="gateForm">
    <label for="pc" style="position:absolute;left:-9999px">Passcode</label>
    <input id="pc" type="password" autocomplete="current-password" autocapitalize="off"
           autocorrect="off" spellcheck="false" required>
    <button class="primary" type="submit" id="go">Take the field</button>
  </form>
  <div class="err" id="gateMsg" role="status" aria-live="polite"></div>
</div>

<div id="app"></div>

const b642u8=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
const gm=document.getElementById('gateMsg');

async function unlock(pass){
  const enc=new TextEncoder();
  const base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:b642u8(CIPHER.s),iterations:CIPHER.n,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b642u8(CIPHER.i)},key,b642u8(CIPHER.c));
  return JSON.parse(new TextDecoder().decode(pt));
}

document.getElementById('gateForm').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=document.getElementById('go');
  gm.className='busy'; gm.textContent='Checking…'; btn.disabled=true;
  try{
    const {html,js}=await unlock(document.getElementById('pc').value);
    document.getElementById('gate').remove();
    document.getElementById('app').innerHTML=html;
    new Function(js)();
  }catch(err){
    gm.className='err'; gm.textContent='Wrong passcode. Try again.';
    btn.disabled=false;
    document.getElementById('pc').select();
  }
});
if(!(window.crypto&&crypto.subtle)){
  gm.className='err';
  gm.textContent='This browser can’t decrypt the board. Open it over https in a current browser.';
}
</script>
